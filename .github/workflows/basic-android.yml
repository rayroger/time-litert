name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Select build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle


    - name: Bundle the latest trained clock model
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p app/src/main/assets
        if gh release download model-latest -p model.tflite -O app/src/main/assets/clock_reader.tflite --clobber; then
          ls -l app/src/main/assets/clock_reader.tflite
        else
          echo "no model-latest release yet: building without the clock model"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Sign APK
      run: |
        VERSION_CODE=${{ github.run_number }}
        VERSION_NAME=1.0.${{ github.run_number }}
        if [[ "${{ github.event.inputs.buildType }}" == "release" ]]; then
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME;
        else
          ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME;
        fi
      env:
        GRADLE_BUILD_TYPE: ${{ github.event.inputs.buildType }}
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Rename APK to include version
      run: |
        VERSION_NAME=1.0.${{ github.run_number }}
        BUILD_TYPE=${{ github.event.inputs.buildType }}
        BUILD_TYPE=${BUILD_TYPE:-debug}
        cd app/build/outputs/apk/$BUILD_TYPE
        for f in *.apk; do
          mv "$f" "${f%.apk}-v$VERSION_NAME.apk"
        done

    - name: Upload APK as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.buildType }}-build
        path: app/build/outputs/apk/${{ github.event.inputs.buildType }}/

    # Publishes the newest main build at a fixed, public URL so a PC (or any script) can fetch it
    # without a GitHub login:
    #   https://github.com/rayroger/time-litert/releases/download/latest-build/app-debug.apk
    - name: Publish APK as release asset (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
        cp "$APK" app-debug.apk
        sha256sum app-debug.apk | cut -d' ' -f1 > app-debug.apk.sha256
        echo "1.0.${{ github.run_number }}" > version.txt
        gh release delete latest-build --yes --cleanup-tag || true
        gh release create latest-build app-debug.apk app-debug.apk.sha256 version.txt \
          --title "Latest build (1.0.${{ github.run_number }})" \
          --notes "Automated debug build of ${{ github.sha }}" \
          --prerelease --target "${{ github.sha }}"
